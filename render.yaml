services:
  # Backend FastAPI Web Service
  - type: web
    name: leadshark-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: leadshark-postgres
          property: connectionString
      - key: FRONTEND_URL
        value: https://leadshark.vercel.app

databases:
  # Managed PostgreSQL Database on Render
  - name: leadshark-postgres
    databaseName: leadshark
    user: leadshark_admin
    plan: free

